name: code-quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check changed code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: python:3.11.17-trixie@sha256:50cfccc707e8721201ee018bfd7f6a85d8eacf49c4f9f75833a2aba09a10411f
    defaults:
      run:
        shell: bash
    env:
      QLTY_TELEMETRY: 'off'
    steps:
      - name: Skip scoring for an upstream sync
        id: scoring
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_BRANCH" == sync/* && "$HEAD_REPO" == "$REPOSITORY" ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Skipped scoring for an upstream sync.'
          fi
      - name: Check out source with history
        if: ${{ steps.scoring.outputs.skip != 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the workspace for git
        if: ${{ steps.scoring.outputs.skip != 'true' }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Score from the baseline commit when this branch carries it beyond the PR merge base; otherwise from the merge base.
      - name: Pick the base to diff from
        if: ${{ steps.scoring.outputs.skip != 'true' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          sha=$(tr -d '[:space:]' < .github/quality-baseline)
          mb=$(git merge-base "origin/$BASE_REF" HEAD) || {
            echo '::error::Cannot compute the pull request merge base.'
            exit 1
          }
          if [ -z "$mb" ]; then
            echo '::error::The pull request merge base is empty.'
            exit 1
          fi
          base="$mb"
          if git merge-base --is-ancestor "$sha" HEAD; then
            if ! git merge-base --is-ancestor "$sha" "$mb"; then
              base="$sha"
            fi
          else
            echo '::warning::Quality baseline is not an ancestor of HEAD; using the merge base.'
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "Diffing from $base"
      - name: Install Qlty CLI 0.652.0, poutine 1.1.6, jq 1.8.2 and zizmor 1.30.1
        if: ${{ steps.scoring.outputs.skip != 'true' }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo qlty.tar.xz https://github.com/qltysh/qlty/releases/download/v0.652.0/qlty-x86_64-unknown-linux-musl.tar.xz
          curl -fsSLo poutine.tar.gz https://github.com/boostsecurityio/poutine/releases/download/v1.1.6/poutine_Linux_x86_64.tar.gz
          curl -fsSLo jq https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
          echo '9d56dfaf60ca52281a7465c9b0a82389071d56a9d014703b4d9f8b8da1f55d50  qlty.tar.xz' | sha256sum -c
          echo 'abde716599a65608b023a69ed9316e5f083a7bca48612151c2720835883757ea  poutine.tar.gz' | sha256sum -c
          echo 'b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f  jq' | sha256sum -c
          mkdir -p bin
          tar -xJf qlty.tar.xz -C bin --strip-components=1
          tar -xzf poutine.tar.gz -C bin poutine
          mv jq bin/jq
          chmod 0755 bin/jq
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          python3 -m pip install zizmor==1.30.1
      - name: Lint changed lines with ruff, actionlint and shellcheck
        if: ${{ steps.scoring.outputs.skip != 'true' }}
        id: qlty-check
        run: |
          qlty check --upstream "$BASE" --no-formatters --no-progress --level medium --no-fail --sarif > "$RUNNER_TEMP/qlty-check.sarif"
      - name: Gate lint findings on changed lines
        if: ${{ steps.scoring.outputs.skip != 'true' }}
        uses: Gorpokki/minecraft-mod-actions/sarif-changed-lines@fca1c54653822990b918578721acade3c732513b # v1.1.0
        with:
          sarif-file: ${{ runner.temp }}/qlty-check.sarif
          base: ${{ env.BASE }}
      - name: Find code smells in changed code
        id: qlty-smells
        if: ${{ steps.scoring.outputs.skip != 'true' && !cancelled() && env.BASE != '' }}
        run: qlty smells --upstream "$BASE" --quiet --sarif > "$RUNNER_TEMP/qlty-smells.sarif"
      - name: Gate code smells on changed lines
        if: ${{ steps.scoring.outputs.skip != 'true' && !cancelled() && steps.qlty-smells.outcome == 'success' }}
        uses: Gorpokki/minecraft-mod-actions/sarif-changed-lines@fca1c54653822990b918578721acade3c732513b # v1.1.0
        with:
          sarif-file: ${{ runner.temp }}/qlty-smells.sarif
          base: ${{ env.BASE }}
      - name: List changed workflow files
        id: changed-workflows
        if: ${{ steps.scoring.outputs.skip != 'true' && !cancelled() && env.BASE != '' }}
        run: |
          git diff --name-only -z --diff-filter=ACMR "$BASE"...HEAD -- '.github/workflows/*.yml' '.github/workflows/*.yaml' > "$RUNNER_TEMP/changed-workflows.txt"
          if [ -s "$RUNNER_TEMP/changed-workflows.txt" ]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No changed workflows to scan.'
          fi
      - name: Scan changed workflows with zizmor
        id: zizmor
        if: ${{ steps.scoring.outputs.skip != 'true' && !cancelled() && steps.changed-workflows.outputs.found == 'true' }}
        run: |
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-workflows.txt"
          zizmor --no-progress --format sarif "${files[@]}" > "$RUNNER_TEMP/zizmor.sarif"
      - name: Gate workflow findings on changed lines
        if: ${{ steps.scoring.outputs.skip != 'true' && !cancelled() && steps.zizmor.outcome == 'success' }}
        uses: Gorpokki/minecraft-mod-actions/sarif-changed-lines@fca1c54653822990b918578721acade3c732513b # v1.1.0
        with:
          sarif-file: ${{ runner.temp }}/zizmor.sarif
          base: ${{ env.BASE }}
      - name: Fail new or worse functions above CCN 15 or cognitive complexity 15
        if: ${{ steps.scoring.outputs.skip != 'true' && !cancelled() && env.BASE != '' }}
        uses: Gorpokki/minecraft-mod-actions/complexity-ratchet@fca1c54653822990b918578721acade3c732513b # v1.1.0
        with:
          ccn-max: '15'
          cognitive-max: '15'
          lizard-version: '1.24.1'
          base: ${{ env.BASE }}
          pathspec: |
            *.py
            *.js
            *.cjs
            *.cs
            *.java
      - name: Check workflows for new supply-chain risks
        id: poutine
        if: ${{ steps.scoring.outputs.skip != 'true' && !cancelled() && steps.changed-workflows.outputs.found == 'true' }}
        run: |
          poutine analyze_local . --quiet --format sarif > "$RUNNER_TEMP/poutine.sarif"
      - name: Gate supply-chain findings on changed lines
        if: ${{ steps.scoring.outputs.skip != 'true' && !cancelled() && steps.poutine.outcome == 'success' }}
        uses: Gorpokki/minecraft-mod-actions/sarif-changed-lines@fca1c54653822990b918578721acade3c732513b # v1.1.0
        with:
          sarif-file: ${{ runner.temp }}/poutine.sarif
          base: ${{ env.BASE }}
      - id: changed-js-ts
        name: List changed JavaScript and TypeScript files
        if: ${{ steps.scoring.outputs.skip != 'true' && !cancelled() && env.BASE != '' }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' > "$RUNNER_TEMP/changed-js-ts.txt"
          if [ -s "$RUNNER_TEMP/changed-js-ts.txt" ]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Use Node.js 24 for anti-slop
        if: ${{ steps.scoring.outputs.skip != 'true' && !cancelled() && steps.changed-js-ts.outputs.found == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Fetch anti-slop at its pinned commit
        if: ${{ steps.scoring.outputs.skip != 'true' && !cancelled() && steps.changed-js-ts.outputs.found == 'true' }}
        env:
          ANTI_SLOP_SHA: c44ef22ca116d0ba62a3ff663a0bd13a3f3fa40b
        run: |
          git init -q "$RUNNER_TEMP/anti-slop"
          git -C "$RUNNER_TEMP/anti-slop" fetch -q --depth 1 https://github.com/dmmulroy/anti-slop.git "$ANTI_SLOP_SHA"
          git -C "$RUNNER_TEMP/anti-slop" checkout -q FETCH_HEAD
      - name: Install anti-slop dependencies from its lockfile
        if: ${{ steps.scoring.outputs.skip != 'true' && !cancelled() && steps.changed-js-ts.outputs.found == 'true' }}
        working-directory: ${{ runner.temp }}/anti-slop
        run: npx -y pnpm@10.33.0 install --frozen-lockfile --ignore-scripts
      - name: Lint changed JavaScript and TypeScript lines with anti-slop
        if: ${{ steps.scoring.outputs.skip != 'true' && !cancelled() && steps.changed-js-ts.outputs.found == 'true' }}
        run: |
          mapfile -t files < "$RUNNER_TEMP/changed-js-ts.txt"
          git diff -U0 --no-color --diff-filter=ACMR "$BASE"...HEAD -- "${files[@]}" \
            | awk '/^\+\+\+ b\//{f=substr($0,7); next} /^@@ /{split($3,r,","); s=substr(r[1],2); n=(r[2]==""?1:r[2]); for(i=0;i<n;i++) print f":"(s+i)}' > "$RUNNER_TEMP/changed-lines.txt"
          cat > "$RUNNER_TEMP/anti-slop-oxlint.json" <<EOF
          {
            "jsPlugins": [{ "name": "anti-slop", "specifier": "$RUNNER_TEMP/anti-slop/src/index.ts" }],
            "categories": { "correctness": "off" },
            "rules": {
              "oxc/no-accumulating-spread": "error",
              "anti-slop/no-array-filter-map": "error",
              "anti-slop/no-reduce-accumulator-copy": "error",
              "anti-slop/no-chained-type-assertions": "error",
              "anti-slop/no-conditional-empty-object-spread": "error",
              "anti-slop/no-known-value-widening": "error",
              "anti-slop/no-module-mocking": "error",
              "anti-slop/no-object-parameters": "error",
              "anti-slop/no-reflect-apply": "error",
              "anti-slop/no-reflect-get": "error",
              "anti-slop/no-runtime-typeof": "error",
              "anti-slop/no-shape-in-symbol-names": "error",
              "anti-slop/no-unknown-parameters": "error",
              "anti-slop/no-unknown-returns": "error",
              "anti-slop/no-unknown-type-aliases": "error",
              "anti-slop/no-unsafe-dictionary-type": "error",
              "anti-slop/no-widen-then-assert": "error",
              "anti-slop/require-readable-spacing": "error",
              "anti-slop/require-safety-comment-for-type-assertion": "error"
            }
          }
          EOF
          rc=0
          "$RUNNER_TEMP/anti-slop/node_modules/.bin/oxlint" -c "$RUNNER_TEMP/anti-slop-oxlint.json" --format=json "${files[@]}" > "$RUNNER_TEMP/anti-slop.json" || rc=$?
          [ "$rc" -le 1 ] || exit "$rc"
          jq -r '.diagnostics[] | "\(.filename)\t\(.labels[0].span.line)\t\(.labels[0].span.offset)\t\(.labels[0].span.length)\t\(.code): \(.message)"' "$RUNNER_TEMP/anti-slop.json" > "$RUNNER_TEMP/anti-slop-spans.tsv"
          while IFS=$'\t' read -r file line offset length text; do
            last=$(( $(head -c $((offset + length)) "$file" | tr -cd '\n' | wc -c) + 1 ))
            echo "$file:$line:$last: $text"
          done < "$RUNNER_TEMP/anti-slop-spans.tsv" > "$RUNNER_TEMP/anti-slop-findings.txt"
          new=$(awk -F: 'NR == FNR { changed[$0] = 1; next } { for (n = $2; n <= $3; n++) if (($1 ":" n) in changed) { print; next } }' "$RUNNER_TEMP/changed-lines.txt" "$RUNNER_TEMP/anti-slop-findings.txt")
          if [ -n "$new" ]; then
            echo "$new"
            echo 'anti-slop: new findings on changed lines (listed above).'
            exit 1
          fi
          echo 'anti-slop: no new findings on changed lines.'
